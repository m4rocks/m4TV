[package]
name = "m4tv-shell"
version.workspace = true
edition.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
m4tv-os.workspace = true
m4tv-settings.workspace = true
serde.workspace = true
toml.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros", "io-util", "process"] }
axum = { version = "0.8", features = ["ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
sha2 = { version = "0.11.1", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
mdns-sd = "0.21"
qrcode = { version = "0.14.1", default-features = false }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
getrandom = "0.4.3"
hmac = "0.13.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
rust-embed = { version = "8.13.0", features = ["include-exclude", "mime-guess"] }

[build-dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
