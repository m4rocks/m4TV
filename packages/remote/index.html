<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m4TV Remote</title>
  </head>
  <body>
    <!-- The landing page. It needs no JavaScript: the app replaces it once it runs, and a browser
         that cannot run the app keeps it. The Remote server fills in the address. -->
    <div id="root">
      <main class="mx-auto my-8 max-w-md px-4 font-sans">
        <h1>m4TV Remote</h1>
        <p>This page needs a full browser. Open this address in Safari or Chrome:</p>
        <p><strong>{{ADDRESS}}</strong></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
