[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
m4tv-os = { path = "crates/os" }
m4tv-settings = { path = "crates/settings" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Third-party weekly snapshot of Zed's gpui: pinned exactly, bumped deliberately.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
