name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Shell must compile for the Dev host (Windows) and the device (Linux): ADR 0003.
# Running the Dev host stays manual.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan-dev libasound2-dev
      # The Shell's build runs npm for the Remote web app (ADR 0004).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/remote/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just ci
